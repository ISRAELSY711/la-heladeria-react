
<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Heladería - Funciones puras</title>
</head>

<body>

    <script>
        //-----------------------------------------
        //UNA FUNCIÓN EN LA QUE SE PUEDE CONFIAR
        const formatPrice = (price) =>
            new Intl.NumberFormat("es-EC", {
                style: "currency",
                currency: "USD",
            }).format(price);

        console.log(formatPrice(1.5));
        console.log(formatPrice(1.5));

        //-----------------------------------------
        //MIRAR AFUERA
        let taxRate = 0.12;
        const priceWithTax = (price) => price * (1 + taxRate);
        console.log(formatPrice(priceWithTax(1.5)));
        taxRate = 0.15;
        console.log(formatPrice(priceWithTax(1.5)));
        //-----------------------------------------

        const menuItem = {
            id: 1,
            iceCream: {
                id: 3,
                name: "Mora silvestre",
                imagePath: "images/mora.svg",
            },
            price: 1.5,
            description: "Mora de Ambato con un toque de limón.",
        };

        const applyDiscount = (item, percent) => {
            item.price = item.price * (1 - percent);
            return item;
        };

        console.log(formatPrice(menuItem.price));
        const enOferta = applyDiscount(menuItem, 0.2);
        console.log(formatPrice(enOferta.price));
        console.log(formatPrice(menuItem.price));

        //-----------------------------------------
        //DEVOLVER EN VEZ DE MODIFICAR
        const withDiscount = (item, percent) => ({
            ...item,
            price: item.price * (1 - percent),
        });

        const rebajado = withDiscount(menuItem, 0.2);

        console.log(formatPrice(rebajado.price));
        console.log(formatPrice(menuItem.price));
        //-----------------------------------------

        console.log(rebajado === menuItem);
        console.log(rebajado.iceCream === menuItem.iceCream);

    </script>

</body>

</html>
